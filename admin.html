<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · BR/US Real Estate Forum</title>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --violet:#57068C; --deep:#330662; --ultra:#7a00cc;
      --black:#f2f1f7;           /* page background */
      --panel:#ffffff;           /* card background */
      --panel2:#eae8f5;          /* secondary / input bg */
      --line:rgba(0,0,0,0.09);   /* border */
      --white:#1a1a1a;           /* main text */
      --tgray:#666666;           /* secondary text */
      --dgray:#aaaaaa;           /* tertiary text */
      --ok:#1c7a38; --warn:#9a5f0e; --err:#c42c28;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--black);color:var(--white);font-family:'Frank Ruhl Libre',Georgia,serif;line-height:1.4;min-height:100vh}
    .mono{font-family:'JetBrains Mono',monospace}
    a{color:var(--ultra)}

    /* ---- login ---- */
    #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .login-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2.2rem 1.8rem;box-shadow:0 4px 24px rgba(0,0,0,0.10)}
    .login-card h1{font-size:1.1rem;font-weight:500;margin-bottom:0.3rem}
    .login-card p{color:var(--tgray);font-size:0.82rem;margin-bottom:1.4rem}
    .login-card .sn{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--ultra);margin-bottom:0.9rem}

    /* ---- shell ---- */
    header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
      padding:0.85rem 1.2rem;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
    header .brand{font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--tgray)}
    header .brand b{color:var(--white);font-weight:500}
    header .spacer{flex:1}
    .tabs{display:flex;gap:0.4rem}
    .tab{font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;
      padding:0.45rem 0.9rem;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--tgray);cursor:pointer}
    .tab.active{background:var(--violet);border-color:var(--violet);color:#fff}
    .status{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--tgray);min-width:90px;text-align:right}
    .status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.dirty{color:var(--warn)}

    main{width:100%;padding:1.4rem 2rem 6rem}
    .section-head{display:flex;align-items:center;gap:0.8rem;margin:0.6rem 0 1.2rem}
    .section-head h2{font-size:1rem;font-weight:500}
    .section-head .count{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--dgray)}

    /* ---- buttons & inputs ---- */
    button{font-family:'JetBrains Mono',monospace;cursor:pointer}
    .btn{font-size:0.72rem;letter-spacing:0.06em;padding:0.5rem 1rem;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--white);transition:.15s}
    .btn:hover{border-color:var(--ultra)}
    .btn.primary{background:var(--ultra);border-color:var(--ultra)}
    .btn.primary:hover{background:#9a18f0}
    .btn.primary:disabled{opacity:.45;cursor:not-allowed}
    .btn.ghost{background:transparent}
    .btn.sm{font-size:0.62rem;padding:0.3rem 0.55rem}
    .btn.danger:hover{border-color:var(--err);color:var(--err)}

    label.fl{display:block;font-family:'JetBrains Mono',monospace;font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--dgray);margin-bottom:0.3rem}
    input[type=text],textarea,select{width:100%;background:var(--black);color:var(--white);border:1px solid var(--line);border-radius:4px;
      padding:0.5rem 0.6rem;font-family:'Frank Ruhl Libre',Georgia,serif;font-size:0.9rem}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ultra)}
    textarea{resize:vertical;min-height:64px;line-height:1.5}
    select{font-family:'JetBrains Mono',monospace;font-size:0.78rem}

    .field{margin-bottom:0.85rem}
    .bi{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem}
    .row{display:grid;gap:0.6rem}
    @media(min-width:720px){.row.c3{grid-template-columns:repeat(3,1fr)}.row.c2{grid-template-columns:1fr 1fr}}

    /* ---- cards ---- */
    .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.1rem;margin-bottom:1rem}
    .card.inactive{opacity:0.55}
    .card-top{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.9rem}
    .card-top .ttl{font-size:0.95rem;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-top .tag{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.1em;color:var(--ultra);text-transform:uppercase}
    .toolbar{display:flex;gap:0.35rem;align-items:center}

    .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--panel2);border:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--tgray);overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}

    .pillrow{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:end}
    .upl{display:flex;align-items:center;gap:0.55rem}
    .upl .thumb{width:46px;height:46px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);object-fit:contain;background-size:contain;background-repeat:no-repeat;background-position:center}
    .upl input[type=file]{display:none}

    .spk-rows{display:flex;flex-direction:column;gap:0.7rem;margin-top:0.5rem}
    .spk-row{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0.75rem}
    .spk-row .hdr{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.6rem}
    .spk-row .hdr .nm{flex:1;font-size:0.85rem}
    .chk{display:inline-flex;align-items:center;gap:0.4rem;font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--tgray);cursor:pointer;user-select:none}
    .chk input{width:auto}
    .hint{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--dgray);margin-top:0.2rem}
    .toolbar-bottom{display:flex;justify-content:space-between;gap:0.6rem;margin-top:1.5rem;flex-wrap:wrap}
    .hidden{display:none!important}
    .searchbar{margin-bottom:1rem}
    .savebar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:1rem;justify-content:flex-end;
      padding:0.7rem 1.2rem;background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -1px 0 var(--line)}
    .err-msg{color:var(--err);font-family:'JetBrains Mono',monospace;font-size:0.72rem;margin-top:0.7rem;min-height:1em}
    .panel-tabs{display:flex;gap:0;margin-bottom:1.4rem;border-bottom:2px solid var(--line);overflow-x:auto}
    .ptab{font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;
      padding:0.55rem 1.1rem;border:none;background:transparent;color:var(--tgray);cursor:pointer;white-space:nowrap;
      border-bottom:2px solid transparent;margin-bottom:-2px;transition:.12s}
    .ptab:hover{color:var(--white)}
    .ptab.active{color:var(--white);border-bottom-color:var(--ultra)}

    /* ---- speakers table ---- */
    .spk-table-wrap{overflow-x:auto;margin-bottom:1rem}
    .spk-table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:0.88rem}
    .spk-table thead tr{background:transparent}
    .spk-table th{font-family:'JetBrains Mono',monospace;font-size:0.54rem;letter-spacing:0.1em;text-transform:uppercase;
      color:var(--dgray);padding:0.2rem 0.8rem;text-align:left;white-space:nowrap;background:transparent}
    .spk-table td{padding:0.65rem 0.8rem;background:var(--panel);vertical-align:middle;
      border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .spk-table td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}
    .spk-table td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
    .spk-table tbody tr{box-shadow:0 1px 4px rgba(0,0,0,0.06);transition:box-shadow .15s}
    .spk-table tbody tr:hover{box-shadow:0 3px 12px rgba(87,6,140,0.10)}
    .spk-table tbody tr.spk-inactive{opacity:.4}
    .spk-table input[type=text]{width:100%;min-width:80px;background:transparent;color:var(--white);
      border:1px solid transparent;border-radius:4px;padding:0.28rem 0.4rem;
      font-family:'Frank Ruhl Libre',Georgia,serif;font-size:0.88rem}
    .spk-table input[type=text]:focus{background:var(--panel2);border-color:var(--ultra);outline:none}
    .spk-table input[type=text]:hover{border-color:var(--line)}
    .spk-table select{background:transparent;color:var(--white);border:1px solid transparent;
      border-radius:4px;padding:0.25rem 0.35rem;font-family:'JetBrains Mono',monospace;font-size:0.74rem;cursor:pointer;width:100%}
    .spk-table select:focus{background:var(--panel2);border-color:var(--ultra);outline:none}
    .spk-table select:hover{border-color:var(--line)}
    .spk-tthumb{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);
      background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--tgray);overflow:hidden;flex-shrink:0;
      transition:border-color .15s}
    .spk-tthumb:hover{border-color:var(--ultra)}
    .spk-tthumb img{width:100%;height:100%;object-fit:cover}
    .spk-lthumb{width:48px;height:48px;border-radius:8px;border:2px solid var(--line);
      background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-size:0.6rem;color:var(--dgray);overflow:hidden;flex-shrink:0;transition:border-color .15s}
    .spk-lthumb:hover{border-color:var(--ultra)}
    .spk-lthumb img{width:100%;height:100%;object-fit:contain}
  </style>
</head>
<body>

  <!-- ===== LOGIN ===== -->
  <div id="login">
    <form class="login-card" id="login-form">
      <div class="sn">BR/US Real Estate Forum</div>
      <h1>Área administrativa</h1>
      <p>Acesso restrito. Informe a senha para editar painéis e speakers.</p>
      <div class="field">
        <label class="fl" for="pw">Senha</label>
        <input type="password" id="pw" autocomplete="current-password" autofocus
          style="width:100%;background:var(--black);color:var(--white);border:1px solid var(--line);border-radius:4px;padding:0.6rem 0.7rem;font-family:'JetBrains Mono',monospace">
      </div>
      <button class="btn primary" type="submit" style="width:100%">Entrar</button>
      <div class="err-msg" id="login-err"></div>
    </form>
  </div>

  <!-- ===== APP ===== -->
  <div id="app" class="hidden">
    <header>
      <div class="brand"><b>Admin</b> · Painéis &amp; Speakers</div>
      <div class="spacer"></div>
      <div class="tabs">
        <button class="tab active" data-tab="panels">Painéis</button>
        <button class="tab" data-tab="speakers">Speakers</button>
      </div>
      <button class="btn ghost sm" id="logout">Sair</button>
    </header>

    <main>
      <div id="view-panels"></div>
      <div id="view-speakers" class="hidden"></div>
    </main>

    <div class="savebar">
      <span class="status" id="status"></span>
      <button class="btn" id="reload">Recarregar</button>
      <button class="btn primary" id="save" disabled>Salvar alterações</button>
    </div>
  </div>

<script type="module">
/* ---------------- tiny helpers ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const el = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function api(path, opts={}) {
  const res = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
  let body=null; try{ body=await res.json(); }catch{}
  if (!res.ok) throw new Error((body && (body.message||body.error)) || res.status);
  return body;
}
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setPath(obj, path, val){
  const ks=path.split('.'); let o=obj;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(o[k]==null) o[k]=/^\d+$/.test(ks[i+1])?[]:{}; o=o[k]; }
  o[ks[ks.length-1]]=val;
}

/* ---------------- state ---------------- */
let data = { version:1, panels:[], speakers:[] };
let dirty = false;
let speakerFilter = '';
let activePanelIdx = 0;

function markDirty(){ dirty=true; $('#save').disabled=false; setStatus('alterações não salvas','dirty'); }
function setStatus(txt, cls=''){ const s=$('#status'); s.textContent=txt; s.className='status '+cls; }

/* ---------------- auth / boot ---------------- */
async function boot(){
  let authed=false;
  try{ const r=await api('/api/login'); authed=!!(r&&r.authed); }catch{}
  if (authed) await enterApp(); else showLogin();
}
function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#pw').focus(); }
async function enterApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  await loadData();
}
$('#login-form').addEventListener('submit', async (e)=>{
  e.preventDefault(); $('#login-err').textContent='';
  try{
    const r=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});
    if(r&&r.ok){ await enterApp(); } else { $('#login-err').textContent='Senha incorreta.'; }
  }catch(err){ $('#login-err').textContent='Senha incorreta.'; }
});
$('#logout').addEventListener('click', async ()=>{
  if (dirty && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
  await api('/api/logout',{method:'POST'}).catch(()=>{});
  location.reload();
});

async function loadData(){
  setStatus('carregando…');
  try{
    data = await api('/api/data');
    data.panels = data.panels||[]; data.speakers = data.speakers||[];
    dirty=false; $('#save').disabled=true;
    migratePanelSpeakers();
    renderPanels(); renderSpeakers();
    setStatus(data.updatedAt ? 'salvo '+fmtTime(data.updatedAt) : 'pronto','ok');
  }catch(err){ setStatus('erro ao carregar','err'); alert('Não consegui carregar os dados: '+err.message); }
}
function fmtTime(iso){ try{ return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch{ return ''; } }

$('#reload').addEventListener('click', ()=>{
  if (dirty && !confirm('Descartar alterações não salvas e recarregar?')) return;
  loadData();
});
$('#save').addEventListener('click', save);
async function save(){
  $('#save').disabled=true; setStatus('salvando…');
  try{
    const r=await api('/api/save',{method:'POST',body:JSON.stringify({version:data.version||1,panels:data.panels,speakers:data.speakers})});
    dirty=false; setStatus('salvo '+fmtTime(r.updatedAt),'ok');
  }catch(err){ setStatus('erro ao salvar','err'); $('#save').disabled=false; alert('Falha ao salvar: '+err.message); }
}
window.addEventListener('beforeunload',(e)=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------------- tabs ---------------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const tab=t.dataset.tab;
  $('#view-panels').classList.toggle('hidden',tab!=='panels');
  $('#view-speakers').classList.toggle('hidden',tab!=='speakers');
}));

/* ---------------- field binding (no re-render on text edits) ---------------- */
function onFieldInput(e){
  const t=e.target; const p=t.dataset.bind; if(!p) return;
  const val = t.type==='checkbox' ? t.checked : t.value;
  setPath(data, p, val);
  if(t.dataset.bind2) setPath(data, t.dataset.bind2, val);
  markDirty();
  if (t.dataset.live==='ttl'){
    const card=t.closest('.card'); if(card){ const ttl=card.querySelector('.ttl'); if(ttl) ttl.textContent=val||'(sem nome)'; }
  }
  if (t.dataset.live==='active'){
    const row=t.closest('tr'); if(row) row.classList.toggle('spk-inactive',!val);
  }
  if (t.dataset.live==='ptab'){
    const activeTab=document.querySelector('.ptab.active');
    if(activeTab){ const pn=data.panels[activePanelIdx]; activeTab.textContent=(pn&&pn.tag&&(pn.tag.pt||pn.tag.en))||`Painel ${activePanelIdx+1}`; }
  }
}
document.addEventListener('input', onFieldInput);
document.addEventListener('change', (e)=>{ if(e.target.dataset.bind) onFieldInput(e); });

/* ---------------- bilingual field helper ---------------- */
function biField(label, base){
  return `<div class="field"><label class="fl">${esc(label)}</label><div class="bi">
    <input type="text" placeholder="EN" data-bind="${base}.en" value="${esc(getPath(data,base+'.en'))}">
    <input type="text" placeholder="PT" data-bind="${base}.pt" value="${esc(getPath(data,base+'.pt'))}">
  </div></div>`;
}

/* ================= PANELS ================= */
function renderPanels(){
  const root=$('#view-panels');
  root.innerHTML='';
  if(!data.panels.length) return;

  // ---- tab bar ----
  const tabBar=el(`<div class="panel-tabs"></div>`);
  data.panels.forEach((p,pi)=>{
    const lbl=(p.tag&&(p.tag.pt||p.tag.en))||`Painel ${pi+1}`;
    const btn=el(`<button class="ptab ${pi===activePanelIdx?'active':''}" data-pti="${pi}">${esc(lbl)}</button>`);
    btn.addEventListener('click',()=>{ activePanelIdx=pi; renderPanels(); });
    tabBar.appendChild(btn);
  });
  root.appendChild(tabBar);

  const p=data.panels[activePanelIdx];
  const pi=activePanelIdx;

  // ---- panel fields ----
  const body=el(`<div></div>`);
  body.innerHTML=
    `<div class="row c2">
       <div class="field"><label class="fl">Etiqueta (tag)</label><div class="bi">
          <input type="text" data-bind="panels.${pi}.tag.en" value="${esc(getPath(data,'panels.'+pi+'.tag.en'))}" placeholder="EN" data-live="ptab">
          <input type="text" data-bind="panels.${pi}.tag.pt" value="${esc(getPath(data,'panels.'+pi+'.tag.pt'))}" placeholder="PT" data-live="ptab"></div></div>
       <div class="field"><label class="fl">Horário</label>
          <input type="text" data-bind="panels.${pi}.time" value="${esc(p.time||'')}" placeholder="9:15 – 10:05"></div>
     </div>`
    +biField('Título do painel','panels.'+pi+'.title')
    +biTextarea('Descrição','panels.'+pi+'.desc');

  // ---- speakers ----
  const activeSpeakers=data.speakers.filter(s=>s.active!==false);
  const spkOpts=activeSpeakers.map(sp=>`<option value="${esc(sp.id)}">${esc((sp.name&&sp.name.en)||sp.id)} — ${esc((sp.company&&sp.company.en)||'')}</option>`).join('');
  const spkWrap=el(`<div class="field">
    <label class="fl">Speakers do painel</label>
    <div class="spk-rows" id="pspk-rows-${pi}"></div>
    <div style="margin-top:0.7rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
      <select id="panel-spk-pick" style="flex:1;min-width:180px;max-width:320px">
        <option value="">— escolher speaker —</option>${spkOpts}
      </select>
      <button class="btn sm" data-action="panel-add-spk" data-pi="${pi}">+ adicionar</button>
    </div>
  </div>`);
  const rowsBox=spkWrap.querySelector(`#pspk-rows-${pi}`);
  (p.speakers||[]).forEach((s,si)=>rowsBox.appendChild(panelSpeakerRow(pi,si,s)));
  body.appendChild(spkWrap);
  root.appendChild(body);
}

function biTextarea(label, base){
  return `<div class="field"><label class="fl">${esc(label)}</label><div class="bi">
    <textarea placeholder="EN" data-bind="${base}.en">${esc(getPath(data,base+'.en'))}</textarea>
    <textarea placeholder="PT" data-bind="${base}.pt">${esc(getPath(data,base+'.pt'))}</textarea>
  </div></div>`;
}

function panelSpeakerRow(pi,si,s){
  const base=`panels.${pi}.speakers.${si}`;
  // resolve speaker: by speakerId (new format) or by photo URL (legacy migration)
  let sp=null;
  if(s.speakerId) sp=data.speakers.find(x=>x.id===s.speakerId);
  if(!sp && s.photo){ sp=data.speakers.find(x=>x.photo===s.photo); if(sp) s.speakerId=sp.id; }
  const name=sp?((sp.name&&sp.name.en)||sp.id):((s.name&&s.name.en)||'(sem nome)');
  const sub=sp?((sp.company&&sp.company.en)||(sp.cargo&&sp.cargo.en)||''):((s.role&&s.role.en)||'');
  const photo=sp?(sp.photo||''):(s.photo||'');
  const initials=sp?(sp.initials||''):'';
  const row=el(`<div class="spk-row" data-pi="${pi}" data-si="${si}">
    <div class="hdr">
      <div class="avatar">${photo?`<img src="${esc(photo)}" onerror="this.remove()">`:(initials?esc(initials):'•')}</div>
      <div style="flex:1;min-width:0;overflow:hidden">
        <div style="font-size:0.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
        <div style="font-size:0.68rem;color:var(--tgray);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div>
      </div>
      ${!sp?`<span style="font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--warn);flex-shrink:0">⚠ não vinculado</span>`:''}
      <label class="chk"><input type="checkbox" data-bind="${base}.tbd" ${s.tbd?'checked':''}> TBD</label>
      <div class="toolbar">
        <button class="btn sm" data-action="pspk-up" data-pi="${pi}" data-si="${si}">↑</button>
        <button class="btn sm" data-action="pspk-down" data-pi="${pi}" data-si="${si}">↓</button>
        <button class="btn sm danger" data-action="pspk-del" data-pi="${pi}" data-si="${si}">remover</button>
      </div>
    </div>
  </div>`);
  return row;
}

/* ================= SPEAKERS ================= */
function renderSpeakers(){
  const root=$('#view-speakers');
  const active=data.speakers.filter(s=>s.active).length;
  root.innerHTML=
    `<div class="section-head"><h2>Speakers do carrossel</h2>
       <span class="count">${data.speakers.length} no total · ${active} ativos</span></div>
     <div class="searchbar"><input type="text" id="spk-search" placeholder="filtrar por nome, empresa ou painel…" value="${esc(speakerFilter)}"></div>
     <div class="spk-table-wrap">
       <table class="spk-table">
         <thead><tr>
           <th title="clique para trocar foto">Foto</th>
           <th>Nome</th>
           <th>Empresa</th>
           <th>Cargo</th>
           <th>Status</th><th>País</th><th>Inic.</th>
           <th title="clique para trocar logo">Logo</th>
           <th>Ativo</th><th></th>
         </tr></thead>
         <tbody id="spk-list"></tbody>
       </table>
     </div>
     <div class="toolbar-bottom"><button class="btn" data-action="spk-add">+ novo speaker</button></div>`;
  $('#spk-search').addEventListener('input',(e)=>{ speakerFilter=e.target.value.toLowerCase(); renderSpeakerList(); });
  renderSpeakerList();
}
function speakerMatches(s){
  if(!speakerFilter) return true;
  const hay=[s.name&&s.name.en,s.name&&s.name.pt,s.company&&s.company.en,s.cargo&&s.cargo.en,s.panelLabel&&s.panelLabel.en,s.panelLabel&&s.panelLabel.pt].join(' ').toLowerCase();
  return hay.includes(speakerFilter);
}
function renderSpeakerList(){
  const list=$('#spk-list'); list.innerHTML='';
  data.speakers.forEach((s,i)=>{ if(speakerMatches(s)) list.appendChild(speakerRow(i,s)); });
}
function speakerRow(i,s){
  const base=`speakers.${i}`;
  const photoContent=s.photo
    ?`<img src="${esc(s.photo)}" onerror="this.style.display='none'">`
    :`<span>${esc(s.initials||'•')}</span>`;
  const logoContent=s.logo
    ?`<img src="${esc(s.logo)}" onerror="this.style.display='none'">`
    :`<span style="color:var(--dgray)">+</span>`;
  const tr=el(`<tr class="${s.active?'':'spk-inactive'}" data-si="${i}">
    <td>
      <div class="spk-tthumb" data-action="upload-photo" data-si="${i}" title="clique para trocar foto">${photoContent}</div>
      <input type="file" accept="image/*" data-file="${base}.photo" style="display:none">
    </td>
    <td><input type="text" data-bind="${base}.name.en" data-bind2="${base}.name.pt" value="${esc((s.name&&s.name.en)||'')}" placeholder="Nome" style="min-width:130px"></td>
    <td><input type="text" data-bind="${base}.company.en" data-bind2="${base}.company.pt" value="${esc((s.company&&s.company.en)||'')}" placeholder="Empresa" style="min-width:140px"></td>
    <td><input type="text" data-bind="${base}.cargo.en" data-bind2="${base}.cargo.pt" value="${esc((s.cargo&&s.cargo.en)||'')}" placeholder="Cargo" style="min-width:130px"></td>
    <td style="min-width:90px">
      <select data-bind="${base}.badge">
        ${['confirmed','proposed','tbd'].map(b=>`<option value="${b}" ${s.badge===b?'selected':''}>${b}</option>`).join('')}
      </select>
    </td>
    <td style="min-width:56px">
      <select data-bind="${base}.flag">
        ${['us','br'].map(f=>`<option value="${f}" ${s.flag===f?'selected':''}>${f.toUpperCase()}</option>`).join('')}
      </select>
    </td>
    <td><input type="text" data-bind="${base}.initials" value="${esc(s.initials||'')}" maxlength="3" style="width:42px;text-align:center"></td>
    <td>
      <div class="spk-lthumb" data-action="upload-logo" data-si="${i}" title="clique para trocar logo">${logoContent}</div>
      <input type="file" accept="image/*" data-file="${base}.logo" style="display:none">
    </td>
    <td style="text-align:center">
      <input type="checkbox" data-bind="${base}.active" data-live="active" ${s.active?'checked':''}>
    </td>
    <td>
      <div class="toolbar" style="gap:0.2rem">
        <button class="btn sm" data-action="spk-up" data-si="${i}">↑</button>
        <button class="btn sm" data-action="spk-down" data-si="${i}">↓</button>
        <button class="btn sm danger" data-action="spk-del" data-si="${i}">✕</button>
      </div>
    </td>
  </tr>`);
  return tr;
}

/* ================= actions ================= */
document.addEventListener('click', async (e)=>{
  const btn=e.target.closest('[data-action]'); if(!btn) return;
  const a=btn.dataset.action;
  const pi=btn.dataset.pi!=null?Number(btn.dataset.pi):null;
  const si=btn.dataset.si!=null?Number(btn.dataset.si):null;

  if(a==='upload'){ const inp=btn.parentElement.querySelector('input[type=file]'); if(inp) inp.click(); return; }
  if(a==='upload-photo'||a==='upload-logo'){
    const row=btn.closest('tr'); if(!row) return;
    const suffix=a==='upload-photo'?'.photo':'.logo';
    const inp=row.querySelector(`input[type=file][data-file$="${suffix}"]`); if(inp) inp.click(); return;
  }

  // speaker list ops
  if(a==='spk-add'){ data.speakers.push(newSpeaker()); markDirty(); renderSpeakers(); return; }
  if(a==='spk-del'){ if(confirm('Remover este speaker?')){ data.speakers.splice(si,1); markDirty(); renderSpeakers(); } return; }
  if(a==='spk-up'){ if(si>0){ swap(data.speakers,si,si-1); markDirty(); renderSpeakers(); } return; }
  if(a==='spk-down'){ if(si<data.speakers.length-1){ swap(data.speakers,si,si+1); markDirty(); renderSpeakers(); } return; }

  // panel speaker ops
  if(a==='panel-add-spk'){
    const sel=$('#panel-spk-pick'); const speakerId=sel?sel.value:'';
    data.panels[pi].speakers=data.panels[pi].speakers||[];
    data.panels[pi].speakers.push({speakerId:speakerId||null,tbd:!speakerId});
    markDirty(); renderPanels(); return;
  }
  if(a==='pspk-del'){ data.panels[pi].speakers.splice(si,1); markDirty(); renderPanels(); return; }
  if(a==='pspk-up'){ if(si>0){ swap(data.panels[pi].speakers,si,si-1); markDirty(); renderPanels(); } return; }
  if(a==='pspk-down'){ const arr=data.panels[pi].speakers; if(si<arr.length-1){ swap(arr,si,si+1); markDirty(); renderPanels(); } return; }
});


// file uploads
document.addEventListener('change', async (e)=>{
  const inp=e.target.closest('input[type=file][data-file]'); if(!inp||!inp.files||!inp.files[0]) return;
  const target=inp.dataset.file; const file=inp.files[0];
  setStatus('enviando imagem…');
  try{
    const dataUrl=await fileToDataUrl(file);
    const r=await api('/api/upload',{method:'POST',body:JSON.stringify({filename:file.name,dataUrl})});
    setPath(data,target,r.url); markDirty();
    // refresh just the relevant view
    if(target.startsWith('panels.')) renderPanels(); else renderSpeakers();
    setStatus('imagem enviada','ok');
  }catch(err){ setStatus('falha no upload','err'); alert('Upload falhou: '+err.message); }
});
function fileToDataUrl(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

/* ---------------- factories ---------------- */
function swap(arr,i,j){ const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
function uid(){ return 'spk-'+Math.random().toString(36).slice(2,8); }
function newSpeaker(){ return { id:uid(), active:true, badge:'tbd', flag:'us', initials:'', photo:'', logo:'',
  name:{en:'',pt:''}, company:{en:'',pt:''}, cargo:{en:'',pt:''}, panelLabel:{en:'',pt:''} }; }
function newPanelSpeaker(){ return { photo:'', name:{en:'',pt:''}, role:{en:'',pt:''}, tbd:true }; }

/* Auto-migrate legacy panel speakers (old format had name/role/photo inline).
   Match by photo URL to find the speaker ID. Runs once after loadData(). */
function migratePanelSpeakers(){
  const byPhoto={};
  data.speakers.forEach(s=>{ if(s.photo) byPhoto[s.photo]=s.id; });
  data.panels.forEach(panel=>{
    (panel.speakers||[]).forEach(s=>{
      if(!s.speakerId && s.photo && byPhoto[s.photo]) s.speakerId=byPhoto[s.photo];
    });
  });
}

boot();
</script>
